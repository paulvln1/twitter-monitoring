<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>signal</title>
  <meta name="description" content="Who's worth following in AI: a living map of the accounts our sources keep relaying.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23EEECE7'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%232B3BD0' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar" id="top">
    <div class="brand"><span class="name">signal/</span> <span class="tagline">who's worth following in AI</span></div>
    <form class="search" id="search" autocomplete="off" role="search">
      <label class="sr" for="q">Search an account</label>
      <input id="q" list="handles" placeholder="search @handle" spellcheck="false">
      <datalist id="handles"></datalist>
    </form>
    <div class="top-right caps">
      <a class="blue" href="https://github.com/paulvln1/twitter-monitoring" target="_blank" rel="noopener">GitHub</a>
      <span class="sep">·</span>
      <span id="auth"><a class="blue" href="/api/login">Log in</a></span>
      <span class="sep">·</span>
      <span id="updated">&nbsp;</span>
    </div>
  </header>

  <main class="map" id="map-area">
    <svg id="graph" role="img" aria-label="Map of accounts"></svg>
    <p class="legend tiny"><span class="dot dot-src"></span>source <span class="dot dot-cand"></span>discovered · size = tweets relayed</p>
    <p class="map-status tiny" id="status">Loading the map…</p>
    <aside class="panel" id="panel" aria-live="polite" hidden>
      <button class="close caps" id="close" type="button">Close ×</button>
      <div id="panel-body"></div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
